# Sections content configuration file
##
### use navigation.yml file to re-order, delete or add section of each card
### here you can find all content in all pre-build sections

### Hero [ hero-image ]
hero:
  image: "assets/img/IMG_1739.jpg"
  image_alt: "Cheon Jinwoo"
  title: "<b>천</b>진우"
  before_title: "안녕하세요, <b>제 이름은</b>"
  after_title: "저는 <strong>사이버보안과</strong> 2학년입니다."
  description: "세상의 원리를 파고들기를 좋아합니다. 저는 세상이 어떻게 작동하는지, 인간은 어떻게 이해해왔는지를 알고 싶어합니다. 그 답은 쉽지 않지만, 이해하려는 시도를 멈추지 않는 것, 그 자체가 제 삶의 태도입니다."
  button1:
    label: "Download CV"
    link: "#"
  button2:
    label: "My Skills"
    link: "#skills-section"
  bg_title: "Web Developer"
  info:
    - num: "12 <strong>+</strong>"
      value: "Years of <strong>Experience</strong>"

    - num: "330"
      value: "Completed <strong>Projects</strong>"

### Services [ services ]
services:
  title: "What I Do"
  subtitle: "my <b>Services</b>"
  bg_title: "Services"

  items:
    - title: "History"
      subtitle: "과거의 메아리"
      text: "고대 문명부터 디지털 혁명까지, 역사는 단지 지나간 일이 아니라 우리가 이어가는 이야기입니다. 세상을 바꾼 순간들을 만나보세요."
      button_label: "자세히 보기"
      button_link: "#"

    - title: "Writings"
      subtitle: "빛 하나를 따라"
      text: "저는 이해라는 불빛 하나를 들고, 기술과 인간, 과거와 미래의 틈을 걷습니다. 이 글들은 그 길 위에서 마주한 풍경들입니다."
      button_label: "자세히 보기"
      button_link: "#"

    - title: "Laps"
      subtitle: "이상한 상상을 해보는 곳"
      text: "이곳은 정답을 찾기 위한 공간이 아닙니다. 다르게 보기, 다르게 만들어 보기. 말도 안 될지도 모르지만, 그래서 더 재미있는 상상과 실험의 기록입니다."
      button_label: "자세히 보기"
      button_link: "#"

### Skills [ skills ]
skills:
  title: "Professional Skills"
  subtitle: "나의 <b>기술</b>"
  bg_title: "Skills"

  column1:
    items:
      - label: "Python" #0-10 progress in dots
        text: "기초적인 파이썬 지식을 가지고 있습니다."
        value: "60" #0-100 progress in %

      - label: "C,C++" #0-10 progress in dots
        text: "아주 기본적인 C,C++ 지식을 가지고 있습니다."
        value: "50" #0-100 progress in %

  column2:
    items:
      - label: "Linux" #0-10 progress in dots
        text: "기초적인 리눅스 지식을 가지고 있습니다."
        value: "50" #0-100 progress in %

